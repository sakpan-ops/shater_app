<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>درج الكاشير - حساب الباقي والفئات</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #eeeaf8;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #fbfbfe;
      padding: 18px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(79, 70, 229, 0.1);
      box-sizing: border-box;
      border: 1px solid #e0dcf2;
    }

    /* المستطيل العلوي المدمج للهوية وأزرار التواصل */
    .top-header-box {
      background: linear-gradient(145deg, #4f46e5, #3730a3);
      border-radius: 14px;
      padding: 14px 12px 10px;
      margin-bottom: 14px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.22);
      border: 1px solid #6366f1;
      text-align: center;
      color: #ffffff;
    }
    .top-header-box h2 {
      margin: 0 0 4px 0;
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.2px;
    }
    .top-header-box .author-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px auto;
      padding: 3px 14px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      font-size: 11.5px;
      color: #f5f3ff;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }
    .top-header-box .social-links {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 2px;
    }
    .top-header-box .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .top-header-box .social-btn:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.28);
    }
    .top-header-box .social-btn.wa-btn {
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.45);
      background: rgba(34, 197, 94, 0.18);
    }
    .top-header-box .social-btn.call-btn {
      color: #bae6fd;
      border-color: rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.18);
    }
    .top-header-box .social-btn.tg-btn {
      color: #bfdbfe;
      border-color: rgba(96, 165, 250, 0.45);
      background: rgba(96, 165, 250, 0.18);
    }
    .top-header-box .social-btn.ig-btn {
      color: #fbcfe8;
      border-color: rgba(244, 114, 182, 0.45);
      background: rgba(244, 114, 182, 0.18);
    }
    .top-header-box .social-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 12px;
      color: #334155;
      font-size: 13.5px;
    }
    input {
      width: 100%;
      padding: 11px;
      margin-top: 5px;
      box-sizing: border-box;
      font-size: 18px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      background: #f8fafc;
      transition: border-color 0.2s;
    }
    #received {
      direction: ltr;
      text-align: left;
      font-family: monospace, sans-serif;
      font-weight: bold;
    }
    #total {
      direction: ltr;
      text-align: left;
      font-family: monospace, sans-serif;
      font-weight: bold;
      overflow-x: auto;
      white-space: nowrap;
    }
    input:focus {
      border-color: #6366f1;
      background: #ffffff;
    }
    .word-preview {
      font-size: 12.5px;
      color: #4f46e5;
      font-weight: 700;
      margin-top: 3px;
      min-height: 18px;
    }
    .audit-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      min-height: 24px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .hint-total {
      font-size: 12.5px;
      color: #4f46e5;
      font-weight: bold;
      line-height: 1.4;
    }
    .btn-audit {
      background: #ede9fe;
      color: #4338ca;
      border: 1px solid #c7d2fe;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-audit:hover {
      background: #e0e7ff;
    }

    .pos-keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
      background: #f2eefb;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #ded6f5;
    }
    .key-btn {
      padding: 11px 4px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      border: 1px solid #d4cde8;
      background: #ffffff;
      color: #1e293b;
      cursor: pointer;
      text-align: center;
      transition: all 0.1s;
    }
    .key-btn:active {
      transform: scale(0.96);
      background: #e9e4f5;
    }
    .key-frac {
      background: #ede9fe;
      color: #5b21b6;
      border-color: #ddd6fe;
      font-size: 13.5px;
    }
    .key-op {
      background: #e0e7ff;
      color: #3730a3;
      border-color: #c7d2fe;
      font-size: 18px;
    }
    .key-del {
      background: #fee2e2;
      color: #991b1b;
      border-color: #fca5a5;
    }
    .key-clear {
      background: #e6e2f3;
      color: #475569;
      border-color: #cbd5e1;
    }

    /* نافذة المراجعة والتدقيق */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.65);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
      z-index: 1000;
    }
    .modal-card {
      background: #fbfbfe;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 18px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      box-sizing: border-box;
      border: 1px solid #e0dcf2;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .modal-header h3 {
      margin: 0;
      font-size: 16px;
      color: #1e1b4b;
    }
    .modal-close-icon {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #64748b;
    }
    .audit-list {
      flex: 1;
      overflow-y: auto;
      max-height: 160px;
      border: 1px solid #e4e0f5;
      border-radius: 8px;
      padding: 6px;
      background: #f6f3fc;
      margin-bottom: 10px;
    }
    .audit-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #ffffff;
      border: 1px solid #ded8f3;
      border-radius: 6px;
      margin-bottom: 5px;
      font-size: 13.5px;
      font-weight: 600;
    }
    .audit-item.latest {
      border-color: #818cf8;
      background: #ede9fe;
    }
    .badge-latest {
      font-size: 10.5px;
      background: #6366f1;
      color: white;
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 6px;
    }
    .audit-item-del {
      color: #ef4444;
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
    }
    .audit-total-line {
      font-size: 13.5px;
      font-weight: bold;
      color: #4338ca;
      text-align: center;
      padding: 6px;
      background: #eef2ff;
      border-radius: 6px;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .options-box {
      margin-top: 14px;
      padding: 12px;
      background: #f4f1fb;
      border: 1px solid #e2ddf3;
      border-radius: 8px;
    }
    .options-title {
      font-size: 13px;
      font-weight: bold;
      color: #475569;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-toggle {
      background: none;
      border: none;
      color: #6366f1;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
      font-weight: 600;
    }
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: normal;
      margin-top: 0;
      cursor: pointer;
      color: #1e293b;
    }
    .checkbox-label input {
      accent-color: #6366f1;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .summary {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }
    .success { background: #dcfce7; color: #166534; }
    .error { background: #fee2e2; color: #991b1b; }
    .breakdown {
      margin-top: 16px;
      border-top: 1px solid #e5e0f5;
      padding-top: 12px;
    }
    .breakdown-title {
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .currency-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      margin-bottom: 5px;
      background: #f4f1fb;
      border-radius: 6px;
      border: 1px solid #e0dcf2;
    }
    .denom-name { font-weight: 600; color: #334155; font-size: 13.5px; }
    .denom-count {
      background: #6366f1;
      color: white;
      padding: 3px 9px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: bold;
    }
    .rounding-note {
      font-size: 12px;
      color: #b91c1c;
      margin-top: 8px;
      text-align: center;
      background: #fff1f2;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #fecdd3;
    }
  </style>
</head>
<body>

<div class="card">
  
  <div class="top-header-box">
    <h2>درج الكاشير - حساب الباقي والفئات</h2>

    <div class="author-badge">

  <label>المبلغ المستلم من الزبون (بالدينار):</label>
  <input type="text" id="received" placeholder="مثال: 50,000" inputmode="numeric" oninput="formatReceivedInput()">
  <div id="receivedWords" class="word-preview"></div>

  <label>المبلغ المطلوب:</label>
  <input type="text" id="total" placeholder="0" readonly>
  
  <div class="audit-bar">
    <div id="hintTotal" class="hint-total"></div>
    <button type="button" class="btn-audit" onclick="openAuditModal()">📋 تدقيق ومراجعة المبالغ</button>
  </div>

  <!-- لوحة الكاشير الرئيسية -->
  <div class="pos-keypad" id="mainKeypad">
    <button type="button" class="key-btn" onclick="pressKey('7')">7</button>
    <button type="button" class="key-btn" onclick="pressKey('8')">8</button>
    <button type="button" class="key-btn" onclick="pressKey('9')">9</button>
    <button type="button" class="key-btn key-frac" onclick="pressSmartFrac(250)">+ 250</button>

    <button type="button" class="key-btn" onclick="pressKey('4')">4</button>
    <button type="button" class="key-btn" onclick="pressKey('5')">5</button>
    <button type="button" class="key-btn" onclick="pressKey('6')">6</button>
    <button type="button" class="key-btn key-frac" onclick="pressSmartFrac(500)">+ 500</button>

    <button type="button" class="key-btn" onclick="pressKey('1')">1</button>
    <button type="button" class="key-btn" onclick="pressKey('2')">2</button>
    <button type="button" class="key-btn" onclick="pressKey('3')">3</button>
    <button type="button" class="key-btn key-frac" onclick="pressSmartFrac(750)">+ 750</button>

    <button type="button" class="key-btn" onclick="pressKey('0')">0</button>
    <button type="button" class="key-btn key-op" onclick="pressKey('000')">000</button>
    <button type="button" class="key-btn key-op" onclick="pressOp('+')">+</button>
    <button type="button" class="key-btn key-del" onclick="pressDel()">⌫</button>

    <button type="button" class="key-btn key-clear" style="grid-column: span 4;" onclick="pressClear()">مسح الحقل بالكامل (C)</button>
  </div>

  <div class="options-box">
    <div class="options-title">
      <span>الفئات المتوفرة في الدرج:</span>
      <button type="button" class="btn-toggle" onclick="toggleAll()">تحديد الكل / إلغاء</button>
    </div>
    <div class="checkbox-grid">
      <label class="checkbox-label"><input type="checkbox" class="denom-check" value="50000" checked onchange="calculateIQD()"> 50 ألف</label>
      <label class="checkbox-label"><input type="checkbox" class="denom-check" value="25000" checked onchange="calculateIQD()"> 25 ألف</label>
      <label class="checkbox-label"><input type="checkbox" class="denom-check" value="10000" checked onchange="calculateIQD()"> 10 آلاف</label>
      <label class="checkbox-label"><input type="checkbox" class="denom-check" value="5000" checked onchange="calculateIQD()"> 5 آلاف</label>
      <label class="checkbox-label"><input type="checkbox" class="denom-check" value="1000" checked onchange="calculateIQD()"> ألف دينار</label>
      <label class="checkbox-label"><input type="checkbox" class="denom-check" value="500" checked onchange="calculateIQD()"> خمسمية (نص)</label>
      <label class="checkbox-label"><input type="checkbox" class="denom-check" value="250" checked onchange="calculateIQD()"> مئتان وخمسون (ربع)</label>
    </div>
  </div>

  <div id="status" class="summary" style="display:none;"></div>

  <div class="breakdown" id="breakdownSection" style="display:none;">
    <div class="breakdown-title">الفئات المقترحة للإرجاع:</div>
    <div id="breakdownList"></div>
    <div id="roundingNotice" class="rounding-note" style="display:none;"></div>
  </div>
</div>

<!-- نافذة المراجعة والتدقيق -->
<div id="auditModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div class="modal-header">
      <h3>قائمة تدقيق المبالغ (من الأحدث للأقدم)</h3>
      <button type="button" class="modal-close-icon" onclick="closeAuditModal()">✖</button>
    </div>

    <div class="audit-list" id="auditItemsList"></div>

    <div class="audit-total-line" id="modalTotalLine">المجموع: 0 د.ع</div>

    <div class="pos-keypad" style="margin-top:0; padding:6px;">
      <button type="button" class="key-btn" onclick="pressKey('7')">7</button>
      <button type="button" class="key-btn" onclick="pressKey('8')">8</button>
      <button type="button" class="key-btn" onclick="pressKey('9')">9</button>
      <button type="button" class="key-btn key-frac" onclick="pressSmartFrac(250)">+ 250</button>

      <button type="button" class="key-btn" onclick="pressKey('4')">4</button>
      <button type="button" class="key-btn" onclick="pressKey('5')">5</button>
      <button type="button" class="key-btn" onclick="pressKey('6')">6</button>
      <button type="button" class="key-btn key-frac" onclick="pressSmartFrac(500)">+ 500</button>

      <button type="button" class="key-btn" onclick="pressKey('1')">1</button>
      <button type="button" class="key-btn" onclick="pressKey('2')">2</button>
      <button type="button" class="key-btn" onclick="pressKey('3')">3</button>
      <button type="button" class="key-btn key-frac" onclick="pressSmartFrac(750)">+ 750</button>

      <button type="button" class="key-btn" onclick="pressKey('0')">0</button>
      <button type="button" class="key-btn key-op" onclick="pressKey('000')">000</button>
      <button type="button" class="key-btn key-op" onclick="pressOp('+')">+</button>
      <button type="button" class="key-btn key-del" onclick="pressDel()">⌫</button>
    </div>

    <button type="button" class="key-btn" style="background:#6366f1; color:#fff; border:none; margin-top:8px;" onclick="closeAuditModal()">تم وإغلاق النافذة</button>
  </div>
</div>

<script>
var IQD_MAP = {
  50000: "50 ألف دينار",
  25000: "25 ألف دينار",
  10000: "10 آلاف دينار",
  5000:  "5 آلاف دينار",
  1000:  "ألف دينار",
  500:   "خمسمية دينار (نص)",
  250:   "مئتان وخمسون (ربع)"
};

function formatIQDWords(num) {
  if (!num || num <= 0) return "";
  
  var billions = Math.floor(num / 1000000000);
  var remAfterBillions = num % 1000000000;

  var millions = Math.floor(remAfterBillions / 1000000);
  var remAfterMillions = remAfterBillions % 1000000;

  var thousands = Math.floor(remAfterMillions / 1000);
  var remainder = remAfterMillions % 1000;
  
  var parts = [];

  if (billions > 0) {
    if (billions === 1) parts.push("مليار");
    else if (billions === 2) parts.push("مليارين");
    else if (billions >= 3 && billions <= 10) parts.push(billions + " مليارات");
    else parts.push(billions.toLocaleString('en-US') + " مليار");
  }

  if (millions > 0) {
    if (millions === 1) parts.push("مليون");
    else if (millions === 2) parts.push("مليونين");
    else if (millions >= 3 && millions <= 10) parts.push(millions + " ملايين");
    else parts.push(millions.toLocaleString('en-US') + " مليون");
  }

  if (thousands > 0) {
    if (thousands === 1) parts.push("ألف");
    else if (thousands === 2) parts.push("ألفين");
    else if (thousands >= 3 && thousands <= 10) parts.push(thousands + " آلاف");
    else parts.push(thousands.toLocaleString('en-US') + " ألف");
  }

  if (remainder > 0) {
    var remText = remainder === 250 ? "ربع" : remainder === 500 ? "نص" : remainder === 750 ? "إلا ربع" : remainder;
    parts.push(remText);
  }

  return "👈 (" + parts.join(" و ") + " دينار)";
}

function formatReceivedInput() {
  var input = document.getElementById('received');
  var raw = input.value.replace(/[^0-9]/g, '');

  if (raw === "") {
    input.value = "";
    document.getElementById('receivedWords').innerText = "";
    calculateIQD();
    return;
  }

  var num = parseInt(raw, 10);
  input.value = num.toLocaleString('en-US');
  document.getElementById('receivedWords').innerText = formatIQDWords(num);
  calculateIQD();
}

var currentTotalExpr = "";

function getCurrentPart() {
  if (!currentTotalExpr) return "";
  var parts = currentTotalExpr.split(" + ");
  return parts[parts.length - 1].trim();
}

function pressKey(val) {
  var lastPart = getCurrentPart();
  if ((val === '0' || val === '000') && (lastPart === "" || currentTotalExpr.endsWith(" + "))) {
    return;
  }
  currentTotalExpr += val;
  updateTotalField();
}

function normalizeCurrentPart() {
  if (!currentTotalExpr || currentTotalExpr.endsWith(" + ")) return;
  var parts = currentTotalExpr.split(" + ");
  var lastPart = parts[parts.length - 1].trim();
  var num = parseFloat(lastPart);
  
  if (!isNaN(num) && num > 0 && num < 250) {
    parts[parts.length - 1] = (num * 1000).toString();
    currentTotalExpr = parts.join(" + ");
  }
}

function pressOp(op) {
  if (currentTotalExpr === "" || currentTotalExpr.endsWith(" + ")) return;
  normalizeCurrentPart();
  currentTotalExpr += " " + op + " ";
  updateTotalField();
}

function pressSmartFrac(fracVal) {
  if (currentTotalExpr === "" || currentTotalExpr.endsWith(" + ")) {
    currentTotalExpr += fracVal + " + ";
  } else {
    var parts = currentTotalExpr.split(" + ");
    var lastPart = parts[parts.length - 1].trim();
    var lastNum = parseFloat(lastPart);

    if (!isNaN(lastNum)) {
      var combined = 0;
      if (lastNum < 250) {
        combined = (lastNum * 1000) + fracVal;
      } else if (lastNum % 1000 === 0) {
        combined = lastNum + fracVal;
      } else {
        normalizeCurrentPart();
        currentTotalExpr += " + " + fracVal + " + ";
        updateTotalField();
        return;
      }
      parts[parts.length - 1] = combined.toString();
      currentTotalExpr = parts.join(" + ") + " + ";
    } else {
      currentTotalExpr += fracVal + " + ";
    }
  }
  updateTotalField();
}

function pressDel() {
  if (currentTotalExpr.endsWith(" + ")) {
    currentTotalExpr = currentTotalExpr.slice(0, -3);
  } else {
    currentTotalExpr = currentTotalExpr.slice(0, -1);
  }
  updateTotalField();
}

function pressClear() {
  currentTotalExpr = "";
  updateTotalField();
}

function updateTotalField() {
  var totalInput = document.getElementById('total');
  totalInput.value = currentTotalExpr;

  setTimeout(function() {
    totalInput.scrollLeft = totalInput.scrollWidth;
  }, 10);

  calculateIQD();
  if (document.getElementById('auditModal').style.display === 'flex') {
    renderAuditList();
  }
}

function openAuditModal() {
  renderAuditList();
  document.getElementById('auditModal').style.display = 'flex';
}

function closeAuditModal() {
  document.getElementById('auditModal').style.display = 'none';
}

function renderAuditList() {
  var listEl = document.getElementById('auditItemsList');
  listEl.innerHTML = "";
  
  var trimmedExpr = currentTotalExpr.trim();
  if (trimmedExpr.endsWith("+")) {
    trimmedExpr = trimmedExpr.slice(0, -1).trim();
  }

  if (!trimmedExpr) {
    listEl.innerHTML = "<div style='text-align:center; color:#94a3b8; padding:20px; font-size:13px;'>لا توجد مبالغ مدخلة حتى الآن</div>";
    document.getElementById('modalTotalLine').innerText = "المجموع: 0 د.ع";
    return;
  }

  var parts = trimmedExpr.split(" + ");
  var validSum = 0;
  var itemsArray = [];

  for (var i = 0; i < parts.length; i++) {
    var raw = parts[i].trim();
    if (!raw) continue;
    var num = parseFloat(raw);
    var actualVal = (num > 0 && num < 250) ? (num * 1000) : num;
    validSum += actualVal;
    itemsArray.push({ index: i, val: actualVal });
  }

  for (var j = itemsArray.length - 1; j >= 0; j--) {
    var item = itemsArray[j];
    var isLatest = (j === itemsArray.length - 1);

    var div = document.createElement('div');
    div.className = "audit-item" + (isLatest ? " latest" : "");
    div.innerHTML = "<span>" +
                    (isLatest ? "<span class='badge-latest'>آخر إضافة</span>" : "") +
                    item.val.toLocaleString('ar-IQ') + " د.ع</span>" +
                    "<button type='button' class='audit-item-del' onclick='removeAuditItem(" + item.index + ")'>❌</button>";
    listEl.appendChild(div);
  }

  var modalWords = formatIQDWords(validSum);
  document.getElementById('modalTotalLine').innerText = "المجموع: " + validSum.toLocaleString('ar-IQ') + " د.ع " + modalWords;
}

function removeAuditItem(index) {
  var trimmedExpr = currentTotalExpr.trim();
  if (trimmedExpr.endsWith("+")) {
    trimmedExpr = trimmedExpr.slice(0, -1).trim();
  }
  var parts = trimmedExpr.split(" + ");
  parts.splice(index, 1);
  currentTotalExpr = parts.length > 0 ? parts.join(" + ") + " + " : "";
  updateTotalField();
}

var allSelected = true;
function toggleAll() {
  allSelected = !allSelected;
  var boxes = document.querySelectorAll('.denom-check');
  for (var i = 0; i < boxes.length; i++) {
    boxes[i].checked = allSelected;
  }
  calculateIQD();
}

function calculateIQD() {
  var recEl = document.getElementById('received');
  var rawReceived = recEl.value.replace(/[^0-9]/g, '');
  var received = parseFloat(rawReceived) || 0;

  var total = 0;
  if (currentTotalExpr.trim() !== "") {
    var parts = currentTotalExpr.split('+');
    for (var p = 0; p < parts.length; p++) {
      var cleanStr = parts[p].replace(/[^0-9.]/g, '');
      var num = parseFloat(cleanStr);
      if (!isNaN(num)) {
        if (num > 0 && num < 250) {
          total += (num * 1000);
        } else {
          total += num;
        }
      }
    }
  }

  var hintTot = document.getElementById('hintTotal');
  var status = document.getElementById('status');
  var section = document.getElementById('breakdownSection');
  var list = document.getElementById('breakdownList');
  var roundingNotice = document.getElementById('roundingNotice');

  if (total > 0) {
    var totalWords = formatIQDWords(total);
    hintTot.innerText = "المجموع: " + total.toLocaleString('ar-IQ') + " د.ع " + totalWords;
  } else {
    hintTot.innerText = "";
  }

  if (received === 0 && total === 0) {
    status.style.display = 'none';
    section.style.display = 'none';
    return;
  }

  status.style.display = 'block';

  if (received < total) {
    status.className = "summary error";
    var diff = total - received;
    status.innerText = "المبلغ ناقص بمقدار: " + diff.toLocaleString('ar-IQ') + " د.ع";
    section.style.display = 'none';
    return;
  }

  var change = received - total;
  status.className = "summary success";
  status.innerText = "الباقي للزبون: " + change.toLocaleString('ar-IQ') + " د.ع";

  list.innerHTML = "";
  roundingNotice.style.display = "none";

  if (change > 0) {
    section.style.display = 'block';

    var checkedBoxes = document.querySelectorAll('.denom-check:checked');
    var availableDenoms = [];
    for (var c = 0; c < checkedBoxes.length; c++) {
      availableDenoms.push(parseInt(checkedBoxes[c].value, 10));
    }
    availableDenoms.sort(function(a, b) { return b - a; });

    if (availableDenoms.length === 0) {
      roundingNotice.style.display = "block";
      roundingNotice.innerText = "تنبيه: لم تحدد أي فئة متوفرة في الدرج!";
      return;
    }

    var temp = Math.floor(change);

    for (var d = 0; d < availableDenoms.length; d++) {
      var val = availableDenoms[d];
      if (temp >= val) {
        var count = Math.floor(temp / val);
        temp = temp % val;

        var itemDiv = document.createElement('div');
        itemDiv.className = "currency-item";
        itemDiv.innerHTML = '<span class="denom-name">' + IQD_MAP[val] + '</span><span class="denom-count">' + count + ' ورقة</span>';
        list.appendChild(itemDiv);
      }
    }

    if (temp > 0) {
      roundingNotice.style.display = "block";
      roundingNotice.innerText = "تعذر إكمال صرف مبلغ (" + temp.toLocaleString('ar-IQ') + " د.ع) لعدم توفر فئات أصغر مفعلة.";
    }
  } else {
    section.style.display = 'none';
  }
}
</script>
